services:
  rostr:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      ROSTR_DB_PATH: /data/rostr.sqlite
      ROSTR_AUTH_LOG: /logs/rostr-auth.jsonl
      ROSTR_SCIM_LOG: /logs/scim.jsonl
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in rostr/.env}
      OKTA_SAML_METADATA_URL: ${OKTA_SAML_METADATA_URL:-}
      ROSTR_BASE_URL: ${ROSTR_BASE_URL:-https://rostr.lanternfieldgoods.co.uk}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER in rostr/.env}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID in rostr/.env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET in rostr/.env}
      SCIM_TOKEN: ${SCIM_TOKEN:?Set SCIM_TOKEN in rostr/.env}
      HR_FILE: /app/hr/employees.json
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      JEV_MIN_CONFIDENCE: ${JEV_MIN_CONFIDENCE:-0.7}
    volumes:
      - ../logs:/logs
      - ./data:/data
      - ../hr:/app/hr:ro
