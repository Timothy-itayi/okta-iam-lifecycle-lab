<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#f4eef8"/>
  <text x="40" y="42" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f1a24">Leave request</text>
  <text x="196" y="42" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5c5366">Jev recommends. A person decides. This is not the joiner, mover, and leaver path.</text>

  <rect x="32" y="64" width="1216" height="176" rx="12" fill="#ffffff" stroke="#d9d0e2"/>
  <text x="52" y="92" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6b6474">1. THE REQUEST IS SAVED BEFORE EITHER CHECK</text>

  <rect x="52" y="112" width="220" height="96" rx="8" fill="#d7e8fb" stroke="#3d6f9c"/>
  <text x="66" y="148" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#16324a">Staff</text>
  <text x="66" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#16324a">POST /leave</text>
  <text x="66" y="188" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#16324a">dates, type, reason</text>

  <line x1="272" y1="160" x2="304" y2="160" stroke="#3d6f9c" stroke-width="1.5"/>
  <polygon points="304,154 304,166 316,160" fill="#3d6f9c"/>

  <rect x="320" y="112" width="280" height="96" rx="8" fill="#d9f2df" stroke="#3d8b4f"/>
  <text x="334" y="148" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4a28">Rostr saves it</text>
  <text x="334" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d4a28">createLeaveRequest</text>
  <text x="334" y="188" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1d4a28">status is already set</text>

  <line x1="600" y1="160" x2="632" y2="160" stroke="#3d6f9c" stroke-width="1.5"/>
  <polygon points="632,154 632,166 644,160" fill="#3d6f9c"/>

  <rect x="648" y="112" width="568" height="96" rx="8" fill="#d7e8fb" stroke="#3d6f9c"/>
  <text x="664" y="148" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#16324a">Waiting on a person</text>
  <text x="664" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#16324a">Department admin, or HR if no other admin</text>
  <text x="664" y="188" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#16324a">is in that department</text>

  <rect x="32" y="260" width="1216" height="268" rx="12" fill="#ffffff" stroke="#d9d0e2"/>
  <text x="52" y="288" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6b6474">2. TWO CHECKS. NEITHER ONE MOVES THE REQUEST</text>

  <rect x="180" y="308" width="400" height="100" rx="8" fill="#d9f2df" stroke="#3d8b4f"/>
  <text x="196" y="344" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4a28">Policy check</text>
  <text x="196" y="366" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d4a28">rostr/policy/leave-rules.json</text>
  <text x="196" y="386" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1d4a28">balance, notice, cover, still active. Deny wins.</text>

  <rect x="700" y="308" width="400" height="100" rx="8" fill="#efe4ff" stroke="#6b4c9a" stroke-width="1.5"/>
  <text x="716" y="344" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#3b2468">Jev</text>
  <text x="716" y="366" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3b2468">systemOne, model jev-latest</text>
  <text x="716" y="386" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3b2468">same facts, plus the reason. 5 seconds, no retry.</text>

  <line x1="380" y1="408" x2="380" y2="436" stroke="#3d8b4f" stroke-width="1.5"/>
  <polygon points="374,436 386,436 380,448" fill="#3d8b4f"/>
  <line x1="900" y1="408" x2="900" y2="436" stroke="#6b4c9a" stroke-width="1.5"/>
  <polygon points="894,436 906,436 900,448" fill="#6b4c9a"/>

  <rect x="180" y="452" width="920" height="52" rx="8" fill="#ffffff" stroke="#6b4c9a"/>
  <text x="196" y="484" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3b2468">leave_reviews</text>
  <text x="330" y="484" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3b2468">both outcomes and the rule. agree is 1, 0, or empty. 0.7 only changes the label on the page.</text>

  <rect x="32" y="548" width="1216" height="196" rx="12" fill="#ffffff" stroke="#d9d0e2"/>
  <text x="52" y="576" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6b6474">3. A PERSON DECIDES. THEN THE HR FILE CHANGES</text>

  <rect x="52" y="596" width="250" height="88" rx="8" fill="#f8d7a8" stroke="#b86a1d"/>
  <text x="66" y="630" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5c3308">Department admin</text>
  <text x="66" y="652" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5c3308">sees both results</text>
  <text x="66" y="670" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c3308">sends it to HR, or denies</text>

  <line x1="302" y1="640" x2="334" y2="640" stroke="#b86a1d" stroke-width="1.5"/>
  <polygon points="334,634 334,646 346,640" fill="#b86a1d"/>

  <rect x="350" y="596" width="230" height="88" rx="8" fill="#f8d7a8" stroke="#b86a1d"/>
  <text x="364" y="630" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5c3308">HR</text>
  <text x="364" y="652" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5c3308">final sign-off</text>
  <text x="364" y="670" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5c3308">cannot approve their own</text>

  <line x1="580" y1="640" x2="612" y2="640" stroke="#3d8b4f" stroke-width="1.5"/>
  <polygon points="612,634 612,646 624,640" fill="#3d8b4f"/>

  <rect x="628" y="596" width="250" height="88" rx="8" fill="#d9f2df" stroke="#3d8b4f"/>
  <text x="642" y="630" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4a28">balance_changes</text>
  <text x="642" y="652" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d4a28">one row, not yet applied</text>
  <text x="642" y="670" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1d4a28">the HR file is untouched</text>

  <line x1="878" y1="640" x2="910" y2="640" stroke="#3d8b4f" stroke-width="1.5"/>
  <polygon points="910,634 910,646 922,640" fill="#3d8b4f"/>

  <rect x="926" y="596" width="290" height="88" rx="8" fill="#d9f2df" stroke="#3d8b4f"/>
  <text x="940" y="630" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4a28">leave-apply</text>
  <text x="940" y="652" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d4a28">scripts/leave-apply --apply</text>
  <text x="940" y="670" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1d4a28">writes one number, needs a REQ</text>

  <text x="52" y="772" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3d3644">If Jev returns 401, 429, a timeout, or no key, the policy row is kept and Jev's columns stay empty. The request does not move.</text>
</svg>
